            <h2>ADD NEW ITEM</h2>
            <p>Fill in the details below to add a new item to the inventory.</p>
        </div>

<section class="form-card">
        <!-- Added enctype="multipart/form-data" for file handling -->
        <form id="assetForm" action="admin-ucao-1.php" method="post" enctype="multipart/form-data">

            <!-- Item Name -->
            <div class="form-group">
                <label for="itemName">
                    <i class="fa-solid fa-tag"></i>
                    Item Name
                </label>
                <input type="text" id="itemName" name="itemName" placeholder="Enter item name" required>
            </div>

            <!-- Quantity -->
            <div class="form-group">
                <label for="quantity">
                    <i class="fa-solid fa-layer-group"></i>
                    Total Quantity
                </label>
                <input type="number" id="quantity" name="quantity" placeholder="Enter total quantity" min="1" required>
            </div>

            <!-- Picture -->
            <div class="form-group">
                <label>
                    <i class="fa-solid fa-image"></i>
                    Item Picture
                </label>

                <div class="upload-box" id="uploadBox">
                    <input type="file" id="itemPicture" name="itemPicture" accept="image/png,image/jpeg" hidden>
                    <div class="upload-content">
                        <div class="upload-icon">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                        <strong>Upload Picture (JPG/PNG)</strong>
                        <span>Click or drag file to upload</span>
                    </div>
                </div>

                <!-- Image Preview -->
                <div class="image-preview" id="imagePreview">
                    <img id="previewImage" src="" alt="Preview">
                    <button type="button" id="removeImage">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">
                    <i class="fa-solid fa-file-lines"></i>
                    Item Description
                </label>
                <textarea id="description" name="description" placeholder="Enter item description" rows="5"></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="submit-btn" id="submitBtn" name="submit">
                <i class="fa-solid fa-box"></i>
                ADD ITEM TO INVENTORY
            </button>

        </form>
    </section>

<!--========= JS ========-->
  <script>
    const hamburger = document.getElementById('hamburger-btn');
    const navMenu = document.getElementById('nav-menu');

    // Toggle menu and hamburger icon state
    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navMenu.classList.toggle('active');
    });

    // Close menu when clicking any menu link
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navMenu.classList.remove('active');
      });
    });
  </script>
